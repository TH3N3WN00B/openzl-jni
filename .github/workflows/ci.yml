name: CI

on:
  push:
    branches: [ main, dev ]
    # Pushing a tag vX.Y.Z (matching the project version) publishes to GitHub Packages.
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the release to Maven Central (otherwise only build and test)'
        type: boolean
        default: false
      version:
        description: 'Release version to publish (e.g. 0.3.3); required when publishing'
        required: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REVISION: 0.3.3

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allow-failure || false }}
    env:
      # CMake (>= 3.17) reads these as defaults, so they also reach the sub-builds
      # OpenZL runs through ExternalProject (xgboost), not only our own project.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
            classifier: linux_amd64
            lib-name: libopenzl_jni.so
            run-tests: true
            allow-failure: false
          - name: windows-x86_64
            runner: windows-2022
            classifier: windows_amd64
            lib-name: openzl_jni.dll
            run-tests: true
            allow-failure: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Most of the native build is OpenZL, protobuf, abseil and xgboost, which only
      # change when their pinned versions do: a warm ccache turns ~10-17 min into a few.
      - name: Cache native compilation (ccache)
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: native-${{ matrix.classifier }}
          max-size: 2G

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          command -v ninja >/dev/null || { sudo apt-get update && sudo apt-get install -y ninja-build; }
          cmake --version | head -n 1

      # The windows-2022 image already ships the MinGW-w64 GCC (C:\mingw64) and CMake the
      # build uses; installing another MinGW with choco cost ~2.5 min and was not used.
      - name: Show toolchain (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          command -v g++ mingw32-make cmake
          g++ --version | head -n 1
          cmake --version | head -n 1

      - name: Configure CMake
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -S . -B cmake_build -G "MinGW Makefiles" \
              -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S . -B cmake_build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build native library
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build cmake_build --target openzl_jni -- -j "$(nproc)"
          else
            cmake --build cmake_build --target openzl_jni
          fi

      - name: ccache statistics
        shell: bash
        run: ccache --show-stats || true

      - name: Stage native artifact
        shell: bash
        run: |
          dest="JNI/openzl-jni/src/main/resources/lib/${{ matrix.classifier }}"
          mkdir -p "$dest"
          if [ "${{ runner.os }}" = "Windows" ]; then
            if [ -f "cmake_build/${{ matrix.lib-name }}" ]; then
              cp "cmake_build/${{ matrix.lib-name }}" "$dest/"
            elif [ -f "cmake_build/cli/${{ matrix.lib-name }}" ]; then
              cp "cmake_build/cli/${{ matrix.lib-name }}" "$dest/"
            else
              echo "Unable to locate built library for Windows target"
              ls cmake_build
              exit 1
            fi
          else
            cp "cmake_build/cli/${{ matrix.lib-name }}" "$dest/"
          fi

      - name: Package classifier (with tests)
        if: matrix.run-tests == true
        shell: bash
        run: |
          mvn -ntp -f JNI/pom.xml -pl openzl-jni -am \
            -Drevision=${REVISION} \
            -Dplatform.classifier=${{ matrix.classifier }} \
            -Dgpg.skip=true clean package

      - name: Package classifier (skip tests)
        if: matrix.run-tests != true
        shell: bash
        run: |
          mvn -ntp -f JNI/pom.xml -pl openzl-jni -am \
            -Drevision=${REVISION} \
            -Dplatform.classifier=${{ matrix.classifier }} \
            -Dgpg.skip=true -DskipTests clean package

      - name: Set up Temurin JDK 25
        if: matrix.run-tests == true
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Test on JDK 25
        if: matrix.run-tests == true
        shell: bash
        run: |
          java -version
          mvn -ntp -f JNI/pom.xml -pl openzl-jni -am \
            -Drevision=${REVISION} \
            -Dgpg.skip=true -Djacoco.skip=true test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openzl-jni-${{ matrix.classifier }}
          retention-days: 7
          path: |
            JNI/openzl-jni/target/*${{ matrix.classifier }}*.jar
            JNI/openzl-jni/target/openzl-jni-${{ env.REVISION }}.jar
            JNI/openzl-jni/src/main/resources/lib/${{ matrix.classifier }}/**

  coverage:
    name: Coverage
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Download Linux native library
        uses: actions/download-artifact@v8
        with:
          name: openzl-jni-linux_amd64
          path: linux-artifact

      - name: Stage native artifact
        run: |
          dest="JNI/openzl-jni/src/main/resources/lib/linux_amd64"
          mkdir -p "$dest"
          lib=$(find linux-artifact -type f -name libopenzl_jni.so | head -n 1)
          if [ -z "$lib" ]; then
            echo "::error::libopenzl_jni.so not found in the linux_amd64 build artifact"
            find linux-artifact -maxdepth 6
            exit 1
          fi
          cp "$lib" "$dest/"

      - name: Generate coverage report
        run: |
          mvn -ntp -f JNI/pom.xml -pl openzl-jni -am \
            org.jacoco:jacoco-maven-plugin:0.8.16:prepare-agent \
            test \
            org.jacoco:jacoco-maven-plugin:0.8.16:report

      - name: Attach coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          retention-days: 7
          path: JNI/openzl-jni/target/site/jacoco

      - name: Summarize coverage
        id: coverage-summary
        run: |
          python3 scripts/coverage_summary.py \
            --report JNI/openzl-jni/target/site/jacoco/jacoco.xml \
            --output coverage-summary.txt \
            --append-to-summary

      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          retention-days: 7
          path: coverage-summary.txt

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('coverage-summary.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });

  # macOS, FreeBSD and illumos only build for releases: they need separate runners or
  # VMs (slow), and macOS runner capacity has been unreliable for everyday pushes.
  platforms:
    name: Extra platforms
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/platforms.yml
    with:
      platforms: all
      strict: true

  publish-github:
    name: Publish to GitHub Packages
    needs:
      - build
      - coverage
      - platforms
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    env:
      # <classifier>:<native library file> of every published platform.
      NATIVE_LIBS: >-
        linux_amd64:libopenzl_jni.so
        windows_amd64:openzl_jni.dll
        macos_arm64:libopenzl_jni.dylib
        macos_amd64:libopenzl_jni.dylib
        freebsd_amd64:libopenzl_jni.so
        sunos_amd64:libopenzl_jni.so
    steps:
      - uses: actions/checkout@v7

      # Writes ~/.m2/settings.xml with server "github", authenticated as this
      # workflow (GITHUB_ACTOR / GITHUB_TOKEN).
      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          server-id: github
          cache: maven

      - name: Check tag matches project version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(mvn -B -ntp -q -f JNI/openzl-jni/pom.xml help:evaluate \
            -Dexpression=project.version -DforceStdout)
          echo "tag=${tag_version} project=${project_version}"
          if [ "${tag_version}" != "${project_version}" ]; then
            echo "::error title=Version mismatch::Tag ${GITHUB_REF_NAME} does not match project version ${project_version}"
            exit 1
          fi
          echo "RELEASE_VERSION=${project_version}" >> "$GITHUB_ENV"

      - name: Download native libraries
        uses: actions/download-artifact@v8
        with:
          pattern: openzl-jni-*
          path: native-artifacts

      - name: Stage native artifacts
        run: |
          for entry in $NATIVE_LIBS; do
            classifier="${entry%%:*}"; lib_name="${entry#*:}"
            dest="JNI/openzl-jni/src/main/resources/lib/${classifier}"
            mkdir -p "$dest"
            lib=$(find "native-artifacts/openzl-jni-${classifier}" -type f -name "${lib_name}" 2>/dev/null | head -n 1)
            if [ -z "$lib" ]; then
              echo "::error::${lib_name} not found in the ${classifier} build artifact"
              exit 1
            fi
            cp "$lib" "$dest/"
            size=$(wc -c < "$dest/${lib_name}")
            echo "staged ${classifier}: ${size} bytes"
            # Stripped libraries are ~16-22 MB; ~200 MB+ means debug info was shipped.
            if [ "$size" -gt 104857600 ]; then
              echo "::error::${classifier}/${lib_name} is ${size} bytes: it was not stripped"
              exit 1
            fi
          done

      - name: Package
        run: |
          mvn -B -ntp -f JNI/pom.xml -pl openzl-jni -am \
            -DskipTests -Dgpg.skip=true -Djacoco.skip=true clean package
          T="JNI/openzl-jni/target"
          for entry in $NATIVE_LIBS; do
            classifier="${entry%%:*}"; lib_name="${entry#*:}"
            jar="$T/openzl-jni-${RELEASE_VERSION}-${classifier}.jar"
            if ! unzip -l "$jar" | grep -q "lib/${classifier}/${lib_name}"; then
              echo "::error::${jar} does not contain lib/${classifier}/${lib_name}"
              exit 1
            fi
          done
          if unzip -l "$T/openzl-jni-${RELEASE_VERSION}.jar" | grep -q ' lib/'; then
            echo "::error::the base jar must not contain native libraries"
            exit 1
          fi

      # deploy-file publishes exactly these files and runs outside the project, so
      # the POM's deploy/Central settings do not interfere. The flattened POM has
      # no <parent> to resolve.
      - name: Deploy base and platform jars
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          T="$GITHUB_WORKSPACE/JNI/openzl-jni/target"
          V="${RELEASE_VERSION}"
          files=""; classifiers=""; types=""
          for entry in $NATIVE_LIBS; do
            classifier="${entry%%:*}"
            files="${files},$T/openzl-jni-$V-${classifier}.jar"
            classifiers="${classifiers},${classifier}"
            types="${types},jar"
          done
          files="${files#,},$T/openzl-jni-$V-sources.jar,$T/openzl-jni-$V-javadoc.jar"
          classifiers="${classifiers#,},sources,javadoc"
          types="${types#,},jar,jar"
          mvn -B -ntp org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -Durl="https://maven.pkg.github.com/${GITHUB_REPOSITORY}" \
            -DrepositoryId=github \
            -DpomFile="$GITHUB_WORKSPACE/JNI/openzl-jni/.flattened-pom.xml" \
            -Dfile="$T/openzl-jni-$V.jar" \
            -Dfiles="$files" \
            -Dclassifiers="$classifiers" \
            -Dtypes="$types"

  # A downstream project on each platform resolves the published package from GitHub
  # Packages and round-trips data through its native library (ci/verify-consumer.sh).
  verify-github-package:
    name: Verify GitHub package (${{ matrix.name }} consumer)
    needs: publish-github
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-22.04
            classifier: linux_amd64
          - name: Windows
            runner: windows-2022
            classifier: windows_amd64
          - name: macOS arm64
            runner: macos-15
            classifier: macos_arm64
          - name: macOS x86_64
            runner: macos-15-intel
            classifier: macos_amd64
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Resolve and use the published package
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: VERSION="${GITHUB_REF_NAME#v}" sh ci/verify-consumer.sh "${{ matrix.classifier }}"

  # The freebsd_amd64 library is built on FreeBSD 14.3; check it on the newest release.
  verify-github-package-freebsd:
    name: Verify GitHub package (FreeBSD 15.1 consumer)
    needs: publish-github
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Resolve and use the published package inside FreeBSD 15.1
        uses: vmactions/freebsd-vm@v1.5.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release: '15.1'
          envs: 'GITHUB_TOKEN GITHUB_ACTOR GITHUB_REPOSITORY GITHUB_REF_NAME'
          prepare: |
            pkg install -y openjdk21 maven
          run: |
            set -e
            export JAVA_HOME=/usr/local/openjdk21
            export PATH="$JAVA_HOME/bin:$PATH"
            VERSION="${GITHUB_REF_NAME#v}" sh ci/verify-consumer.sh freebsd_amd64

  verify-github-package-illumos:
    name: Verify GitHub package (illumos consumer)
    needs: publish-github
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Resolve and use the published package inside OmniOS
        uses: vmactions/omnios-vm@v1.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release: 'r151054'
          envs: 'GITHUB_TOKEN GITHUB_ACTOR GITHUB_REPOSITORY GITHUB_REF_NAME'
          prepare: |
            pkg install runtime/java/openjdk21 || test $? -eq 4
          run: |
            set -e
            sh ci/install-maven.sh
            java_bin=$(find /usr/jdk /usr/java /opt -path '*21*/bin/java' 2>/dev/null | head -n 1)
            JAVA_HOME=$(dirname "$(dirname "$java_bin")")
            export JAVA_HOME
            export PATH="$JAVA_HOME/bin:$PATH"
            VERSION="${GITHUB_REF_NAME#v}" sh ci/verify-consumer.sh sunos_amd64

  publish:
    name: Publish Artifacts
    needs:
      - build
      - coverage
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-22.04
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
    steps:
      - name: Check required parameters
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: |
          missing=()
          [ -n "${RELEASE_VERSION}" ] || missing+=("input 'version'")
          [ -n "${MAVEN_USERNAME}" ] || missing+=("secret MAVEN_USERNAME")
          [ -n "${MAVEN_PASSWORD}" ] || missing+=("secret MAVEN_PASSWORD")
          [ "${HAS_GPG_KEY}" = "true" ] || missing+=("secret GPG_PRIVATE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Publishing is not configured::Missing ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v7

      # setup-java writes ~/.m2/settings.xml (server "central") and imports the signing key.
      - name: Set up Temurin JDK for publishing
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Download classifier artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: openzl-jni-*
          path: release-artifacts
          merge-multiple: false

      - name: Set release version in POM
        run: |
          mvn -ntp -f JNI/pom.xml versions:set \
            -DnewVersion=${{ inputs.version }} \
            -DgenerateBackupPoms=false

      - name: Build and publish release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          classifiers=(linux_amd64 windows_amd64)
          rm -rf JNI/openzl-jni/src/main/resources/lib
          mkdir -p JNI/openzl-jni/src/main/resources/lib
          rm -rf release-packages
          for classifier in "${classifiers[@]}"; do
            dest="JNI/openzl-jni/src/main/resources/lib/${classifier}"
            mkdir -p "${dest}"
            src_dir=$(find "release-artifacts/openzl-jni-${classifier}" -maxdepth 10 -type d -path "*/src/main/resources/lib/${classifier}" | head -n 1 || true)
            if [ -z "${src_dir}" ] || [ ! -d "${src_dir}" ]; then
              echo "Expected resources for ${classifier} not found under release-artifacts/openzl-jni-${classifier}"
              find "release-artifacts/openzl-jni-${classifier}" -maxdepth 10 -type d || true
              exit 1
            fi
            cp -R "${src_dir}/." "${dest}/"
          done
          mvn --batch-mode -ntp -f JNI/openzl-jni/pom.xml \
            -Drevision=${RELEASE_VERSION} \
            -DskipTests \
            -Dgpg.passphraseServerId= \
            clean package central-publishing:publish
          mkdir -p release-packages/base
          cp JNI/openzl-jni/target/openzl-jni-${RELEASE_VERSION}.jar release-packages/base/
          cp JNI/openzl-jni/target/openzl-jni-${RELEASE_VERSION}.jar.asc release-packages/base/ || true
          cp JNI/openzl-jni/target/openzl-jni-${RELEASE_VERSION}-sources.jar release-packages/base/ || true
          cp JNI/openzl-jni/target/openzl-jni-${RELEASE_VERSION}-sources.jar.asc release-packages/base/ || true
          cp JNI/openzl-jni/target/openzl-jni-${RELEASE_VERSION}-javadoc.jar release-packages/base/ || true
          cp JNI/openzl-jni/target/openzl-jni-${RELEASE_VERSION}-javadoc.jar.asc release-packages/base/ || true
          cp JNI/openzl-jni/pom.xml release-packages/base/openzl-jni-${RELEASE_VERSION}.pom
          cp LICENSE release-packages/base/
          cp NOTICE release-packages/base/
          cp THIRD_PARTY.md release-packages/base/
          for classifier in "${classifiers[@]}"; do
            mkdir -p release-packages/${classifier}
            cp JNI/openzl-jni/target/openzl-jni-${RELEASE_VERSION}-${classifier}.jar release-packages/${classifier}/
            cp JNI/openzl-jni/target/openzl-jni-${RELEASE_VERSION}-${classifier}.jar.asc release-packages/${classifier}/ || true
            cp LICENSE release-packages/${classifier}/
            cp NOTICE release-packages/${classifier}/
            cp THIRD_PARTY.md release-packages/${classifier}/
          done

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: openzl-jni-release-${{ inputs.version }}
          retention-days: 14
          path: release-packages/**
