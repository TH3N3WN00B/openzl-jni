name: CI

on:
  push:
    branches: [ main, dev ]
    # Pushing a tag vX.Y.Z (matching the project version) publishes to GitHub Packages.
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the release to Maven Central (otherwise only build and test)'
        type: boolean
        default: false
      version:
        description: 'Release version to publish (e.g. 0.3.0); required when publishing'
        required: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REVISION: 0.3.0

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allow-failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
            classifier: linux_amd64
            lib-name: libopenzl_jni.so
            run-tests: true
            allow-failure: false
          - name: windows-x86_64
            runner: windows-2022
            classifier: windows_amd64
            lib-name: openzl_jni.dll
            run-tests: true
            allow-failure: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          cmake --version | head -n 1

      - name: Install MinGW toolchain (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install mingw --yes
          choco install make --yes
          choco install cmake --yes

      - name: Configure CMake
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -S . -B cmake_build -G "MinGW Makefiles" \
              -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S . -B cmake_build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build native library
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build cmake_build --target openzl_jni -- -j "$(nproc)"
          else
            cmake --build cmake_build --target openzl_jni
          fi

      - name: Stage native artifact
        shell: bash
        run: |
          dest="JNI/openzl-jni/src/main/resources/lib/${{ matrix.classifier }}"
          mkdir -p "$dest"
          if [ "${{ runner.os }}" = "Windows" ]; then
            if [ -f "cmake_build/${{ matrix.lib-name }}" ]; then
              cp "cmake_build/${{ matrix.lib-name }}" "$dest/"
            elif [ -f "cmake_build/cli/${{ matrix.lib-name }}" ]; then
              cp "cmake_build/cli/${{ matrix.lib-name }}" "$dest/"
            else
              echo "Unable to locate built library for Windows target"
              ls cmake_build
              exit 1
            fi
          else
            cp "cmake_build/cli/${{ matrix.lib-name }}" "$dest/"
          fi

      - name: Package classifier (with tests)
        if: matrix.run-tests == true
        shell: bash
        run: |
          mvn -ntp -f JNI/pom.xml -pl openzl-jni -am \
            -Drevision=${REVISION} \
            -Dplatform.classifier=${{ matrix.classifier }} \
            -Dgpg.skip=true clean package

      - name: Package classifier (skip tests)
        if: matrix.run-tests != true
        shell: bash
        run: |
          mvn -ntp -f JNI/pom.xml -pl openzl-jni -am \
            -Drevision=${REVISION} \
            -Dplatform.classifier=${{ matrix.classifier }} \
            -Dgpg.skip=true -DskipTests clean package

      - name: Set up Temurin JDK 25
        if: matrix.run-tests == true
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Test on JDK 25
        if: matrix.run-tests == true
        shell: bash
        run: |
          java -version
          mvn -ntp -f JNI/pom.xml -pl openzl-jni -am \
            -Drevision=${REVISION} \
            -Dgpg.skip=true -Djacoco.skip=true test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openzl-jni-${{ matrix.classifier }}
          retention-days: 7
          path: |
            JNI/openzl-jni/target/*${{ matrix.classifier }}*.jar
            JNI/openzl-jni/target/openzl-jni-${{ env.REVISION }}.jar
            JNI/openzl-jni/src/main/resources/lib/${{ matrix.classifier }}/**

  coverage:
    name: Coverage
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Download Linux native library
        uses: actions/download-artifact@v8
        with:
          name: openzl-jni-linux_amd64
          path: linux-artifact

      - name: Stage native artifact
        run: |
          dest="JNI/openzl-jni/src/main/resources/lib/linux_amd64"
          mkdir -p "$dest"
          lib=$(find linux-artifact -type f -name libopenzl_jni.so | head -n 1)
          if [ -z "$lib" ]; then
            echo "::error::libopenzl_jni.so not found in the linux_amd64 build artifact"
            find linux-artifact -maxdepth 6
            exit 1
          fi
          cp "$lib" "$dest/"

      - name: Generate coverage report
        run: |
          mvn -ntp -f JNI/pom.xml -pl openzl-jni -am \
            org.jacoco:jacoco-maven-plugin:0.8.16:prepare-agent \
            test \
            org.jacoco:jacoco-maven-plugin:0.8.16:report

      - name: Attach coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          retention-days: 7
          path: JNI/openzl-jni/target/site/jacoco

      - name: Summarize coverage
        id: coverage-summary
        run: |
          python3 scripts/coverage_summary.py \
            --report JNI/openzl-jni/target/site/jacoco/jacoco.xml \
            --output coverage-summary.txt \
            --append-to-summary

      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          retention-days: 7
          path: coverage-summary.txt

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('coverage-summary.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });

  publish-github:
    name: Publish to GitHub Packages
    needs:
      - build
      - coverage
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Writes ~/.m2/settings.xml with server "github", authenticated as this
      # workflow (GITHUB_ACTOR / GITHUB_TOKEN).
      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          server-id: github

      - name: Check tag matches project version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(mvn -B -ntp -q -f JNI/openzl-jni/pom.xml help:evaluate \
            -Dexpression=project.version -DforceStdout)
          echo "tag=${tag_version} project=${project_version}"
          if [ "${tag_version}" != "${project_version}" ]; then
            echo "::error title=Version mismatch::Tag ${GITHUB_REF_NAME} does not match project version ${project_version}"
            exit 1
          fi
          echo "RELEASE_VERSION=${project_version}" >> "$GITHUB_ENV"

      - name: Download Linux native library
        uses: actions/download-artifact@v8
        with:
          name: openzl-jni-linux_amd64
          path: linux-artifact

      - name: Stage native artifact
        run: |
          dest="JNI/openzl-jni/src/main/resources/lib/linux_amd64"
          mkdir -p "$dest"
          lib=$(find linux-artifact -type f -name libopenzl_jni.so | head -n 1)
          if [ -z "$lib" ]; then
            echo "::error::libopenzl_jni.so not found in the linux_amd64 build artifact"
            exit 1
          fi
          cp "$lib" "$dest/"

      - name: Package
        run: |
          mvn -B -ntp -f JNI/pom.xml -pl openzl-jni -am \
            -DskipTests -Dgpg.skip=true -Djacoco.skip=true clean package
          unzip -l "JNI/openzl-jni/target/openzl-jni-${RELEASE_VERSION}-linux_amd64.jar" \
            | grep 'lib/linux_amd64/libopenzl_jni.so'

      # deploy-file publishes exactly these files (this job's windows_amd64 jar has
      # no DLL) and runs outside the project, so the POM's deploy/Central settings
      # do not interfere. The flattened POM has no <parent> to resolve.
      - name: Deploy base and linux_amd64 jars
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          T="$GITHUB_WORKSPACE/JNI/openzl-jni/target"
          V="${RELEASE_VERSION}"
          mvn -B -ntp org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -Durl="https://maven.pkg.github.com/${GITHUB_REPOSITORY}" \
            -DrepositoryId=github \
            -DpomFile="$GITHUB_WORKSPACE/JNI/openzl-jni/.flattened-pom.xml" \
            -Dfile="$T/openzl-jni-$V.jar" \
            -Dfiles="$T/openzl-jni-$V-linux_amd64.jar,$T/openzl-jni-$V-sources.jar,$T/openzl-jni-$V-javadoc.jar" \
            -Dclassifiers=linux_amd64,sources,javadoc \
            -Dtypes=jar,jar,jar

  verify-github-package:
    name: Verify GitHub package (Linux consumer)
    needs: publish-github
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          server-id: github-openzl-jni

      # Behaves like a downstream project: resolves only from GitHub Packages and
      # Maven Central, then compresses with the published native library.
      - name: Resolve and use the published package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir consumer && cd consumer
          cat > pom.xml <<EOF
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>example</groupId>
            <artifactId>openzl-consumer</artifactId>
            <version>1.0</version>
            <repositories>
              <repository>
                <id>github-openzl-jni</id>
                <url>https://maven.pkg.github.com/${GITHUB_REPOSITORY}</url>
              </repository>
            </repositories>
            <dependencies>
              <dependency>
                <groupId>io.github.th3n3wn00b</groupId>
                <artifactId>openzl-jni</artifactId>
                <version>${version}</version>
              </dependency>
              <dependency>
                <groupId>io.github.th3n3wn00b</groupId>
                <artifactId>openzl-jni</artifactId>
                <version>${version}</version>
                <classifier>linux_amd64</classifier>
              </dependency>
            </dependencies>
          </project>
          EOF
          mvn -B -ntp dependency:tree
          mvn -B -ntp -q dependency:copy-dependencies -DoutputDirectory=libs
          ls -la libs
          if ls libs | grep -q protobuf; then
            echo "::error::protobuf-java should be optional, but the consumer pulled it"
            exit 1
          fi
          cat > Check.java <<'EOF'
          import io.github.hybledav.OpenZLCompressionLevel;
          import io.github.hybledav.OpenZLCompressor;
          import java.nio.charset.StandardCharsets;
          import java.util.Arrays;

          public class Check {
              public static void main(String[] args) {
                  byte[] data = "openzl-jni from GitHub Packages ".repeat(4096).getBytes(StandardCharsets.UTF_8);
                  try (OpenZLCompressor c = new OpenZLCompressor()) {
                      c.setCompressionLevel(OpenZLCompressionLevel.LEVEL_19);
                      byte[] packed = c.compress(data);
                      if (!Arrays.equals(data, c.decompress(packed))) {
                          throw new AssertionError("round trip failed");
                      }
                      System.out.println("OK " + data.length + " -> " + packed.length + " bytes");
                  }
              }
          }
          EOF
          java --enable-native-access=ALL-UNNAMED -cp "libs/*" Check.java

  publish:
    name: Publish Artifacts
    needs:
      - build
      - coverage
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-22.04
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
    steps:
      - name: Check required parameters
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: |
          missing=()
          [ -n "${RELEASE_VERSION}" ] || missing+=("input 'version'")
          [ -n "${MAVEN_USERNAME}" ] || missing+=("secret MAVEN_USERNAME")
          [ -n "${MAVEN_PASSWORD}" ] || missing+=("secret MAVEN_PASSWORD")
          [ "${HAS_GPG_KEY}" = "true" ] || missing+=("secret GPG_PRIVATE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Publishing is not configured::Missing ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v7

      # setup-java writes ~/.m2/settings.xml (server "central") and imports the signing key.
      - name: Set up Temurin JDK for publishing
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Download classifier artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: openzl-jni-*
          path: release-artifacts
          merge-multiple: false

      - name: Set release version in POM
        run: |
          mvn -ntp -f JNI/pom.xml versions:set \
            -DnewVersion=${{ inputs.version }} \
            -DgenerateBackupPoms=false

      - name: Build and publish release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          classifiers=(linux_amd64 windows_amd64)
          rm -rf JNI/openzl-jni/src/main/resources/lib
          mkdir -p JNI/openzl-jni/src/main/resources/lib
          rm -rf release-packages
          for classifier in "${classifiers[@]}"; do
            dest="JNI/openzl-jni/src/main/resources/lib/${classifier}"
            mkdir -p "${dest}"
            src_dir=$(find "release-artifacts/openzl-jni-${classifier}" -maxdepth 10 -type d -path "*/src/main/resources/lib/${classifier}" | head -n 1 || true)
            if [ -z "${src_dir}" ] || [ ! -d "${src_dir}" ]; then
              echo "Expected resources for ${classifier} not found under release-artifacts/openzl-jni-${classifier}"
              find "release-artifacts/openzl-jni-${classifier}" -maxdepth 10 -type d || true
              exit 1
            fi
            cp -R "${src_dir}/." "${dest}/"
          done
          mvn --batch-mode -ntp -f JNI/openzl-jni/pom.xml \
            -Drevision=${RELEASE_VERSION} \
            -DskipTests \
            -Dgpg.passphraseServerId= \
            clean package central-publishing:publish
          mkdir -p release-packages/base
          cp JNI/openzl-jni/target/openzl-jni-${RELEASE_VERSION}.jar release-packages/base/
          cp JNI/openzl-jni/target/openzl-jni-${RELEASE_VERSION}.jar.asc release-packages/base/ || true
          cp JNI/openzl-jni/target/openzl-jni-${RELEASE_VERSION}-sources.jar release-packages/base/ || true
          cp JNI/openzl-jni/target/openzl-jni-${RELEASE_VERSION}-sources.jar.asc release-packages/base/ || true
          cp JNI/openzl-jni/target/openzl-jni-${RELEASE_VERSION}-javadoc.jar release-packages/base/ || true
          cp JNI/openzl-jni/target/openzl-jni-${RELEASE_VERSION}-javadoc.jar.asc release-packages/base/ || true
          cp JNI/openzl-jni/pom.xml release-packages/base/openzl-jni-${RELEASE_VERSION}.pom
          cp LICENSE release-packages/base/
          cp NOTICE release-packages/base/
          cp THIRD_PARTY.md release-packages/base/
          for classifier in "${classifiers[@]}"; do
            mkdir -p release-packages/${classifier}
            cp JNI/openzl-jni/target/openzl-jni-${RELEASE_VERSION}-${classifier}.jar release-packages/${classifier}/
            cp JNI/openzl-jni/target/openzl-jni-${RELEASE_VERSION}-${classifier}.jar.asc release-packages/${classifier}/ || true
            cp LICENSE release-packages/${classifier}/
            cp NOTICE release-packages/${classifier}/
            cp THIRD_PARTY.md release-packages/${classifier}/
          done

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: openzl-jni-release-${{ inputs.version }}
          retention-days: 14
          path: release-packages/**
