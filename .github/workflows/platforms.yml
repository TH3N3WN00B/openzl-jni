name: Extra platforms

# Builds the native library and runs the Java test-suite on the platforms that need a
# VM or a separate runner: macOS arm64/x86_64, FreeBSD and illumos (SunOS).
#  - Called by CI on release tags (strict: any failure blocks publishing). The shipped
#    libraries are uploaded as `openzl-jni-<classifier>` artifacts.
#  - Run by hand (Actions > Extra platforms > Run workflow) as a non-blocking probe.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which platforms to build and test'
        type: choice
        default: all
        options: [all, macos, freebsd, illumos]
      strict:
        description: 'Fail the run when a platform fails'
        type: boolean
        default: false
  workflow_call:
    inputs:
      platforms:
        type: string
        default: all
      strict:
        type: boolean
        default: true

jobs:
  macos:
    name: macOS ${{ matrix.name }}
    if: inputs.platforms == 'all' || inputs.platforms == 'macos'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    continue-on-error: ${{ !inputs.strict }}
    env:
      # Users run macOS 15.5 to 27.x: target 15.0 so one dylib covers all of them.
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_UPGRADE: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            runner: macos-15
            classifier: macos_arm64
          - name: x86_64
            runner: macos-15-intel
            classifier: macos_amd64
    steps:
      - uses: actions/checkout@v7

      # The last version listed becomes the default JAVA_HOME (25); 21 stays reachable
      # through JAVA_HOME_21_<ARCH>.
      - name: Set up Temurin JDK 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Toolchain
        run: |
          sw_vers
          uname -m
          command -v ninja >/dev/null || brew install ninja
          cmake --version | head -n 1
          c++ --version | head -n 1

      - name: Build native library
        run: |
          cmake -S . -B cmake_build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build cmake_build --target openzl_jni
          lib=cmake_build/cli/libopenzl_jni.dylib
          minos=$(otool -l "$lib" | awk '/LC_BUILD_VERSION/ {f=1} f && $1=="minos" {print $2; exit}')
          echo "minimum macOS: $minos"
          if [ "$minos" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
            echo "::error::$lib targets macOS $minos, expected $MACOSX_DEPLOYMENT_TARGET"
            exit 1
          fi
          otool -L "$lib"
          mkdir -p "JNI/openzl-jni/src/main/resources/lib/${{ matrix.classifier }}"
          cp "$lib" "JNI/openzl-jni/src/main/resources/lib/${{ matrix.classifier }}/"

      - name: Test on JDK 21
        run: |
          export JAVA_HOME="$JAVA_HOME_21_${{ matrix.name == 'arm64' && 'ARM64' || 'X64' }}"
          mvn -B -ntp -f JNI/pom.xml -pl openzl-jni -am -Dgpg.skip=true -Djacoco.skip=true package

      - name: Test on JDK 25
        run: |
          java -version
          mvn -B -ntp -f JNI/pom.xml -pl openzl-jni -am -Dgpg.skip=true -Djacoco.skip=true test

      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: openzl-jni-${{ matrix.classifier }}
          retention-days: 7
          path: JNI/openzl-jni/src/main/resources/lib/${{ matrix.classifier }}/**

  freebsd:
    name: FreeBSD ${{ matrix.release }} (amd64)
    if: inputs.platforms == 'all' || inputs.platforms == 'freebsd'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    continue-on-error: ${{ !inputs.strict }}
    strategy:
      fail-fast: false
      matrix:
        # Java 21 (needed by these bindings and by current Paper) is packaged for the
        # supported FreeBSD branches only (13.x is EOL, its package repository is gone).
        # The library shipped as freebsd_amd64 is built on the oldest supported release;
        # FreeBSD keeps that binary working on newer releases (checked after publishing).
        include:
          - release: '14.3'
            ship: true
          - release: '15.1'
            ship: false
    steps:
      - uses: actions/checkout@v7

      - name: Build and test inside FreeBSD
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: ${{ matrix.release }}
          mem: 12288
          cpu: 4
          prepare: |
            pkg install -y openjdk21 maven cmake ninja git
          run: |
            set -e
            export JAVA_HOME=/usr/local/openjdk21
            freebsd-version -ku
            cc --version | head -n 1
            cmake --version | head -n 1
            "$JAVA_HOME/bin/java" -version
            # Build outside the synced workspace so copyback stays small.
            cmake -S . -B /tmp/ozl-build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/ozl-build --target openzl_jni
            mkdir -p JNI/openzl-jni/src/main/resources/lib/freebsd_amd64
            cp /tmp/ozl-build/cli/libopenzl_jni.so JNI/openzl-jni/src/main/resources/lib/freebsd_amd64/
            ldd JNI/openzl-jni/src/main/resources/lib/freebsd_amd64/libopenzl_jni.so
            mvn -B -ntp -f JNI/pom.xml -pl openzl-jni -am -Dgpg.skip=true -Djacoco.skip=true package

      - name: Upload native library
        if: matrix.ship
        uses: actions/upload-artifact@v7
        with:
          name: openzl-jni-freebsd_amd64
          retention-days: 7
          path: JNI/openzl-jni/src/main/resources/lib/freebsd_amd64/**

  illumos:
    name: illumos / OmniOS ${{ matrix.release }} (SunOS)
    if: inputs.platforms == 'all' || inputs.platforms == 'illumos'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    continue-on-error: ${{ !inputs.strict }}
    strategy:
      fail-fast: false
      matrix:
        # r151054 is the current OmniOS LTS (supported until 2028-05).
        release: ['r151054-build']
    steps:
      - uses: actions/checkout@v7

      - name: Build and test inside OmniOS
        uses: vmactions/omnios-vm@v1.3.8
        with:
          release: ${{ matrix.release }}
          mem: 12288
          cpu: 4
          prepare: |
            set -ex
            uname -a
            pkg set-publisher -O https://pkg.omnios.org/r151054/extra extra.omnios
            # `pkg install` is all-or-nothing: install each group on its own
            # (exit code 4 = nothing to do).
            pkg install runtime/java/openjdk21 developer/versioning/git || test $? -eq 4
            pkg install ooce/developer/cmake ooce/developer/ninja || test $? -eq 4
          run: |
            set -e
            uname -a
            # OmniOS has no Maven package: use the official binary distribution.
            sh ci/install-maven.sh
            gcc --version | head -n 1
            java_bin=$(find /usr/jdk /usr/java /opt -path '*21*/bin/java' 2>/dev/null | head -n 1)
            JAVA_HOME=$(dirname "$(dirname "$java_bin")")
            export JAVA_HOME
            export PATH="/opt/ooce/bin:$JAVA_HOME/bin:$PATH"
            "$JAVA_HOME/bin/java" -version
            cmake -S . -B /tmp/ozl-build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/ozl-build --target openzl_jni
            mkdir -p JNI/openzl-jni/src/main/resources/lib/sunos_amd64
            cp /tmp/ozl-build/cli/libopenzl_jni.so JNI/openzl-jni/src/main/resources/lib/sunos_amd64/
            ldd JNI/openzl-jni/src/main/resources/lib/sunos_amd64/libopenzl_jni.so
            mvn -B -ntp -f JNI/pom.xml -pl openzl-jni -am -Dgpg.skip=true -Djacoco.skip=true package

      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: openzl-jni-sunos_amd64
          retention-days: 7
          path: JNI/openzl-jni/src/main/resources/lib/sunos_amd64/**
