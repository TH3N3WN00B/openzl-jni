name: Platform probe

# Manual, non-blocking experiment: can the native library be built and the Java test
# suite pass on the extra platforms our users run (macOS, FreeBSD, illumos/SunOS)?
# Results decide which classifiers the release pipeline will publish.
on:
  workflow_dispatch:

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    continue-on-error: true
    env:
      # Users run macOS 15.5 to 27.x: target 15.0 so one dylib covers all of them.
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_UPGRADE: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            runner: macos-15
            classifier: macos_arm64
          - name: x86_64
            runner: macos-15-intel
            classifier: macos_amd64
    steps:
      - uses: actions/checkout@v7

      # The last version listed becomes the default JAVA_HOME (25); 21 stays reachable
      # through JAVA_HOME_21_<ARCH>.
      - name: Set up Temurin JDK 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Toolchain
        run: |
          sw_vers
          uname -m
          command -v ninja >/dev/null || brew install ninja
          cmake --version | head -n 1
          c++ --version | head -n 1

      - name: Build native library
        run: |
          cmake -S . -B cmake_build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build cmake_build --target openzl_jni
          lib=cmake_build/cli/libopenzl_jni.dylib
          otool -l "$lib" | awk '/LC_BUILD_VERSION/ {f=1} f && $1=="minos" {print "minos", $2; exit}'
          otool -L "$lib"
          mkdir -p "JNI/openzl-jni/src/main/resources/lib/${{ matrix.classifier }}"
          cp "$lib" "JNI/openzl-jni/src/main/resources/lib/${{ matrix.classifier }}/"

      - name: Test on JDK 21
        run: |
          export JAVA_HOME="$JAVA_HOME_21_${{ matrix.name == 'arm64' && 'ARM64' || 'X64' }}"
          mvn -B -ntp -f JNI/pom.xml -pl openzl-jni -am -Dgpg.skip=true -Djacoco.skip=true package

      - name: Test on JDK 25
        run: |
          java -version
          mvn -B -ntp -f JNI/pom.xml -pl openzl-jni -am -Dgpg.skip=true -Djacoco.skip=true test

      - name: Upload native library
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-${{ matrix.classifier }}
          retention-days: 7
          if-no-files-found: ignore
          path: JNI/openzl-jni/src/main/resources/lib/${{ matrix.classifier }}/**

  freebsd:
    name: FreeBSD ${{ matrix.release }} (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Java 21 (needed by these bindings and by current Paper) is packaged for the
        # supported FreeBSD branches only; 13.x is EOL and its package repository is gone.
        release: ['14.3', '15.1']
    steps:
      - uses: actions/checkout@v7

      - name: Build and test inside FreeBSD
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: ${{ matrix.release }}
          mem: 12288
          cpu: 4
          prepare: |
            pkg install -y openjdk21 maven cmake ninja git
          run: |
            set -e
            export JAVA_HOME=/usr/local/openjdk21
            freebsd-version -ku
            cc --version | head -n 1
            cmake --version | head -n 1
            "$JAVA_HOME/bin/java" -version
            # Build outside the synced workspace so copyback stays small.
            cmake -S . -B /tmp/ozl-build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/ozl-build --target openzl_jni
            mkdir -p JNI/openzl-jni/src/main/resources/lib/freebsd_amd64
            cp /tmp/ozl-build/cli/libopenzl_jni.so JNI/openzl-jni/src/main/resources/lib/freebsd_amd64/
            ldd JNI/openzl-jni/src/main/resources/lib/freebsd_amd64/libopenzl_jni.so
            mvn -B -ntp -f JNI/pom.xml -pl openzl-jni -am -Dgpg.skip=true -Djacoco.skip=true package

      - name: Upload native library
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-freebsd-${{ matrix.release }}
          retention-days: 7
          if-no-files-found: ignore
          path: JNI/openzl-jni/src/main/resources/lib/freebsd_amd64/**

  illumos:
    name: illumos / OmniOS ${{ matrix.release }} (SunOS)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        release: ['r151054-build']
    steps:
      - uses: actions/checkout@v7

      - name: Build and test inside OmniOS
        uses: vmactions/omnios-vm@v1.3.8
        with:
          release: ${{ matrix.release }}
          mem: 12288
          cpu: 4
          prepare: |
            set -ex
            uname -a
            pkg set-publisher -O https://pkg.omnios.org/${{ matrix.release == 'r151054-build' && 'r151054' || matrix.release }}/extra extra.omnios
            # `pkg install` is all-or-nothing: install each group on its own.
            pkg install runtime/java/openjdk21 || test $? -eq 4
            pkg install ooce/developer/cmake ooce/developer/ninja || test $? -eq 4
            # OmniOS has no Maven package: use the official binary distribution.
            v=3.9.16
            base=https://archive.apache.org/dist/maven/maven-3/$v/binaries/apache-maven-$v-bin.tar.gz
            curl -fsSL -o /tmp/maven.tgz "$base"
            curl -fsSL -o /tmp/maven.tgz.sha512 "$base.sha512"
            test "$(digest -a sha512 /tmp/maven.tgz)" = "$(cut -d' ' -f1 /tmp/maven.tgz.sha512)"
            mkdir -p /opt/maven && gzip -dc /tmp/maven.tgz | (cd /opt/maven && tar xf -)
            ln -sf /opt/maven/apache-maven-$v/bin/mvn /usr/bin/mvn
          run: |
            set -e
            uname -a
            gcc --version | head -n 1 || true
            command -v cmake ninja mvn java || true
            java_bin=$(find /usr/jdk /usr/java /opt -path '*21*/bin/java' 2>/dev/null | head -n 1)
            JAVA_HOME=$(dirname "$(dirname "$java_bin")")
            export JAVA_HOME
            echo "JAVA_HOME=$JAVA_HOME"
            "$JAVA_HOME/bin/java" -version
            export PATH="/opt/ooce/bin:$JAVA_HOME/bin:$PATH"
            command -v cmake ninja mvn java
            cmake -S . -B /tmp/ozl-build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/ozl-build --target openzl_jni
            mkdir -p JNI/openzl-jni/src/main/resources/lib/sunos_amd64
            cp /tmp/ozl-build/cli/libopenzl_jni.so JNI/openzl-jni/src/main/resources/lib/sunos_amd64/
            ldd JNI/openzl-jni/src/main/resources/lib/sunos_amd64/libopenzl_jni.so
            mvn -B -ntp -f JNI/pom.xml -pl openzl-jni -am -Dgpg.skip=true -Djacoco.skip=true package

      - name: Upload native library
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-sunos-${{ matrix.release }}
          retention-days: 7
          if-no-files-found: ignore
          path: JNI/openzl-jni/src/main/resources/lib/sunos_amd64/**
